    limit: 10

  # === Hacker News ===

  - id: hackernews
    name: Hacker News
    type: hackernews
    url: https://news.ycombinator.com
    story_type: top
    min_score: 100
    limit: 30
    description: HN 热门技术讨论

  # === 学术论文 ===

  - id: huggingface-papers
    name: HuggingFace Papers
